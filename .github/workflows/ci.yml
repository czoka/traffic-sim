name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  EM_VERSION: "4.0.11" # must match the Emscripten used by Godot 4.7's web templates
  GODOT_VERSION: "4.7.2"

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            platform: linux
          - name: Windows x86_64 (MSVC)
            os: windows-2022
            platform: windows
          - name: macOS universal (Apple Silicon runner)
            os: macos-15
            platform: macos
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: scons-${{ matrix.platform }}-
      - name: C++ unit tests + golden determinism hash
        run: scons platform=${{ matrix.platform }} tests bench
      - name: Benchmark (native core, golden scenario)
        shell: bash
        run: |
          if [ -f build/native/tsim_bench.exe ]; then build/native/tsim_bench.exe; else build/native/tsim_bench; fi
      - name: Extension (debug)
        run: scons platform=${{ matrix.platform }} target=template_debug
      - name: Extension (release)
        run: scons platform=${{ matrix.platform }} target=template_release
      - name: Godot smoke tests (editor, sim, POC) + quick benchmark (headless, Linux only)
        if: matrix.platform == 'linux'
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT="./Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          # Godot 4.7.2 aborts on exit after a headless import, once the import is
          # done. The smoke tests below fail if the import really went wrong.
          "$GODOT" --headless --path game --import || echo "import exited with $?"
          "$GODOT" --headless --path game --script res://tests/editor_smoke_test.gd
          "$GODOT" --headless --path game --script res://tests/sim_smoke_test.gd
          "$GODOT" --headless --path game --script res://tests/poc_smoke_test.gd
          "$GODOT" --headless --path game -- --bench-quick
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.platform }}
          path: |
            game/bin/*
            !game/bin/*.framework/Resources

  web:
    name: Web (wasm32, no threads)
    runs-on: ubuntu-24.04
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-web-${{ github.sha }}
          restore-keys: scons-web-
      - name: C++ unit tests in wasm under node (same golden hash as native)
        run: scons platform=web threads=no tests bench
      - name: Benchmark (wasm core under V8)
        run: node build/web/tsim_bench.js
      - name: Extension (debug)
        run: scons platform=web threads=no target=template_debug
      - name: Extension (release)
        run: scons platform=web threads=no target=template_release
      - uses: actions/upload-artifact@v4
        with:
          name: extension-web
          path: game/bin/*.wasm
