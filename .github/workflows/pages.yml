name: Web build on GitHub Pages

# Exports the Godot project for the web and publishes it on GitHub Pages
# every time main changes. The web build is single-threaded, so it needs no
# COOP/COEP headers and runs on plain static hosting.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EM_VERSION: "4.0.11" # must match the Emscripten used by Godot 4.7's web templates
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    name: Export web build
    runs-on: ubuntu-24.04
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
      - uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-web-${{ github.sha }}
          restore-keys: scons-web-
      - name: Extension (web, release)
        run: scons platform=web threads=no target=template_release
      - name: Godot and its web export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: |
            godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-web-${{ env.GODOT_VERSION }}
      - name: Download Godot and the web templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          # Only the web templates (the full archive is 1.3 GB).
          unzip -q -j -o templates.tpz 'templates/web_*' 'templates/version.txt' -d "$dest"
          rm templates.tpz godot.zip
      - name: Export
        run: |
          GODOT="godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p build/web
          # Godot 4.7.2 aborts on exit after a headless import, once the import
          # is done; the export below fails if the import really went wrong.
          "$GODOT" --headless --path game --import || echo "import exited with $?"
          "$GODOT" --headless --path game --export-release Web ../build/web/index.html
          test -f build/web/index.html
          test -f build/web/libtraffic_sim.web.template_release.wasm32.nothreads.wasm
          ls -la build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
